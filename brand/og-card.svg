<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Fearth Game Studio — Games and mobile products, shipped end to end.">
  <rect width="1200" height="630" fill="#fdf6e7" />

  <!-- decorative blobs -->
  <circle cx="1100" cy="90" r="250" fill="#f6e3b8" />
  <circle cx="60" cy="600" r="220" fill="#f7dfe4" />
  <circle cx="1040" cy="520" r="130" fill="#dcefd0" />

  <!-- leaf mark -->
  <g transform="translate(90 96) scale(2.6)">
    <path d="M0,50 A60,50 0 0 1 60,0 A40,60 0 0 1 100,60 A55,40 0 0 1 45,100 A45,50 0 0 1 0,50 Z" fill="#6baa5c" />
  </g>

  <!-- title -->
  <text x="90" y="330" font-family="'Baloo 2', ui-rounded, system-ui, sans-serif" font-size="96" font-weight="800" fill="#2f4a34">Fearth Game Studio</text>

  <!-- apricot accent bar -->
  <rect x="94" y="366" width="120" height="10" rx="5" fill="#e8894a" />

  <!-- tagline -->
  <text x="92" y="430" font-family="Nunito, system-ui, sans-serif" font-size="34" font-weight="400" fill="#5b7a5f">Games and mobile products, shipped end to end.</text>

  <!-- meta strip -->
  <text x="92" y="520" font-family="Nunito, system-ui, sans-serif" font-size="26" font-weight="700" fill="#8aa37f">6 TITLES  ·  5 PLATFORMS  ·  HO CHI MINH CITY</text>
</svg>